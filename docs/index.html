<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Notes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button class="menu-toggle" id="menuToggle">&#9776;</button>
  <div class="app">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>Medical Notes</h1>
        <p>Harrison's 22e + First Choice</p>
      </div>
      <div id="navContent">
        <p style="padding:1.25rem;color:var(--text-muted);font-size:0.85rem;">Loading...</p>
      </div>
    </nav>
    <main class="main" id="mainContent">
      <div class="welcome" id="welcomePage">
        <h1>Medical Notes</h1>
        <p>Choose a specialty from the sidebar, or browse all topics below.</p>
        <div class="specialty-grid" id="specialtyGrid"></div>
      </div>
      <div id="notePage" style="display:none;"></div>
    </main>
  </div>
  <div id="highlightToolbar" style="display:none;position:fixed;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:4px;box-shadow:0 2px 8px rgba(0,0,0,0.12);z-index:100;">
    <button class="hl-btn" data-color="yellow" style="width:24px;height:24px;border-radius:50%;border:1px solid #ccc;background:var(--bg-highlight-yellow);cursor:pointer;margin:2px;" title="Yellow"></button>
    <button class="hl-btn" data-color="green" style="width:24px;height:24px;border-radius:50%;border:1px solid #ccc;background:var(--bg-highlight-green);cursor:pointer;margin:2px;" title="Green"></button>
    <button class="hl-btn" data-color="blue" style="width:24px;height:24px;border-radius:50%;border:1px solid #ccc;background:var(--bg-highlight-blue);cursor:pointer;margin:2px;" title="Blue"></button>
    <button class="hl-btn" data-color="pink" style="width:24px;height:24px;border-radius:50%;border:1px solid #ccc;background:var(--bg-highlight-pink);cursor:pointer;margin:2px;" title="Pink"></button>
    <button class="hl-btn" data-color="none" style="width:24px;height:24px;border-radius:50%;border:1px solid #ccc;background:#fff;cursor:pointer;margin:2px;font-size:12px;" title="Remove">&#x2715;</button>
    <span style="width:1px;height:20px;background:var(--border);margin:0 2px;display:inline-block;vertical-align:middle;"></span>
    <button class="hl-btn" data-color="annotate" style="width:24px;height:24px;border-radius:50%;border:1px solid #ccc;background:var(--accent-light);cursor:pointer;margin:2px;font-size:13px;" title="Add note">&#x1F4AC;</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
